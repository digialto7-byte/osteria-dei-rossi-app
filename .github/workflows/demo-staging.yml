name: Demo data on staging

# Demo data plan step 15 (docs/plans/2026-10-24-demo-data.md §0, §3.7, ADR-018 revision 1). Started by hand from the Actions
# tab on main only; the 'staging' environment's required reviewer approves the run. Two inputs:
#   action     seed     fill the EXISTING tenant with demo data (refused when it holds data or already carries demo data)
#              reset    reset the tenant's operational data (it must carry demo data) and its demo logins, then seed again
#              purge    reset it, then remove the demo logins and fake PDFs
#              cleanup  only finish the login and PDF clean-up of an earlier reset (for example after the owner's button)
#   tenant_id  the uuid of the existing tenant (not needed for cleanup). The tenant's name and id are client facts: they are
#              typed into the run form and never written in the repository.
# The three Supabase secrets live only in the 'staging' environment and reach the script step only: never npm ci,
# never the logs. The demo owner is a fake on a reserved domain, so no mailbox setting is needed. The PIN pepper and the
# extraction key are not needed. The script prints one JSON line of counts and masked names; it is also written to the job summary.
# Without Actions minutes, the same run is done by hand from a trusted machine: plan §8 "Running the demo".

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the demo data on staging
        type: choice
        required: true
        default: seed
        options:
          - seed
          - reset
          - purge
          - cleanup
      tenant_id:
        description: Id (uuid) of the existing tenant; not needed for cleanup
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: demo-staging
  cancel-in-progress: false

jobs:
  demo:
    name: Demo data on staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      # The only project this job may touch; any other Supabase URL stops it before the script runs.
      STAGING_PROJECT_REF: wjowhjsfpcdykxwgjipq
    steps:
      # FIRST, before anything else prints: the tenant id is a client fact and this repository's logs are public. The runner
      # prints every `env:` value of a step, so the id is never passed as an expression: it is read from the event file here,
      # masked, and only then handed to the later steps through GITHUB_ENV (a line the runner does not print). A value that is
      # not a uuid is masked too but not passed on, so a stray newline cannot add another variable.
      - name: Mask the tenant id
        run: |
          id="$(jq -r '.inputs.tenant_id // ""' "$GITHUB_EVENT_PATH")"
          while IFS= read -r line; do
            [ -z "$line" ] || echo "::add-mask::$line"
          done <<< "$id"
          if [[ "$id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "DEMO_TENANT_ID=$id" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Demo data against staging
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEMO_STAGING_OK: "yes"
          DEMO_ACTION: ${{ inputs.action }}
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing staging settings::Add SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY as secrets of the 'staging' environment (missing: ${missing[*]})."
            exit 1
          fi
          host="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          host="${host%%/*}"
          if [ "$host" != "$STAGING_PROJECT_REF.supabase.co" ]; then
            echo "::error title=Wrong project::SUPABASE_URL is not the staging project; refusing to run."
            exit 1
          fi
          case "$DEMO_ACTION" in
            seed) flag="" ;;
            reset) flag="--reset" ;;
            purge) flag="--purge" ;;
            cleanup) flag="--cleanup" ;;
            *) echo "::error title=Unknown action::The action must be seed, reset, purge or cleanup."; exit 1 ;;
          esac
          args=(--target staging)
          [ -z "$flag" ] || args+=("$flag")
          if [ "$DEMO_ACTION" != "cleanup" ]; then
            if ! [[ "$DEMO_TENANT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error title=Tenant id::The tenant_id input must be the uuid of the existing tenant."
              exit 1
            fi
            args+=(--tenant "$DEMO_TENANT_ID")
          fi
          status=0
          output="$(npm run --silent demo -- "${args[@]}")" || status=$?
          echo "$output"
          {
            echo '```json'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
