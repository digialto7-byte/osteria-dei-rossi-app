# REVIEW NOTICE: any change to this file needs the lead's line-by-line read in the pull request. The guard test (tests/config/platform-ops-workflow.test.ts)
# is a safety net, not the review: it can only refuse what its author thought of.

name: Platform ops

# SP3 step 6 (docs/plans sp3 section 3.13): the only place the Supabase secret key is used on a person's request. Started by hand (Actions, "platform-ops", "Run workflow").
# Every job that reads a secret waits on the protected environment `platform-ops`, whose required reviewer is the founder's GitHub account, after the summary job
# has written what will happen.
#
# The repository is public: inputs and logs are readable by anyone.
#   - Inputs are ids and codes only; the tenant's and the owner's data are environment secrets (GitHub masks those).
#   - GitHub prints a step's environment block, values included, in the log header before the step runs, so NO input value is ever in one. The first step of EVERY
#     job (a mask only counts inside the job that registers it) reads the inputs from the event file, checks them, masks each id and only then exports it through
#     GITHUB_ENV. Later steps use the exported names as shell variables and print at most the first 8 characters of an id.
#   - Every line of every run block is on the allowlist of tests/config/platform-ops-workflow.test.ts.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operazione"
        type: choice
        required: true
        options:
          - mfa-reset
          - set-mfa-enforcement
          - create-tenant
          - bootstrap
      user:
        description: "mfa-reset: id (uuid) della persona nel locale (app_user)"
        type: string
        required: false
      actor:
        description: "mfa-reset e set-mfa-enforcement: id (uuid) di un admin del locale (app_user)"
        type: string
        required: false
      tenant:
        description: "set-mfa-enforcement: id (uuid) del locale"
        type: string
        required: false
      auth_id:
        description: "bootstrap: id (uuid) dell'account di Auth, facoltativo (senza, l'account è cercato con il segreto PLATFORM_ADMIN_EMAIL)"
        type: string
        required: false
      mode:
        description: "set-mfa-enforcement: modalità (scegli una: «scegli» viene rifiutato)"
        type: choice
        required: true
        default: scegli
        options:
          - scegli
          - "off"
          - enrolled
          - required
      conferma_disconnessione:
        description: "La persona verrà disconnessa da tutti i locali in cui ha un accesso (e dalla console, se è l'account DigiAlto) e al prossimo accesso dovrà attivare di nuovo il codice."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: platform-ops
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  summary:
    name: What will happen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Read the inputs
        run: |
          set -eu
          read_uuid() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          read_choice() { jq -er --arg k "$1" --arg allowed "$2" '(.inputs[$k] // "") as $v | $v | select(($allowed | split(" ")) | index($v))' "$GITHUB_EVENT_PATH"; }
          read_bool() { jq -er --arg k "$1" '(.inputs[$k] // "false") | tostring | select(. == "true" or . == "false")' "$GITHUB_EVENT_PATH"; }
          read_uuid_opt() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(. == "" or test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          operation=$(read_choice operation "mfa-reset set-mfa-enforcement create-tenant bootstrap") || { echo "::error::operation: scelta non valida / invalid choice"; exit 1; }
          echo "OPERATION=$operation" >> "$GITHUB_ENV"
          if [ "$operation" = "mfa-reset" ]; then
          user=$(read_uuid user) || { echo "::error::user: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$user"
          echo "USER_ID=$user" >> "$GITHUB_ENV"
          actor=$(read_uuid actor) || { echo "::error::actor: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$actor"
          echo "ACTOR_ID=$actor" >> "$GITHUB_ENV"
          confirmed=$(read_bool conferma_disconnessione) || { echo "::error::conferma_disconnessione: valore non valido / invalid value"; exit 1; }
          echo "CONFIRMED=$confirmed" >> "$GITHUB_ENV"
          fi
          if [ "$operation" = "set-mfa-enforcement" ]; then
          tenant=$(read_uuid tenant) || { echo "::error::tenant: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$tenant"
          echo "TENANT_ID=$tenant" >> "$GITHUB_ENV"
          actor=$(read_uuid actor) || { echo "::error::actor: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$actor"
          echo "ACTOR_ID=$actor" >> "$GITHUB_ENV"
          mode=$(read_choice mode "off enrolled required") || { echo "::error::mode: valore non valido / invalid value"; exit 1; }
          echo "MODE=$mode" >> "$GITHUB_ENV"
          fi
          if [ "$operation" = "bootstrap" ]; then
          auth_id=$(read_uuid_opt auth_id) || { echo "::error::auth_id: serve un uuid minuscolo o nulla / a lowercase uuid or nothing is required"; exit 1; }
          if [ "$auth_id" != "" ]; then
          echo "::add-mask::$auth_id"
          fi
          echo "AUTH_ID=$auth_id" >> "$GITHUB_ENV"
          fi
      - name: Write the summary (no environment, no secrets)
        run: |
          set -eu
          {
          echo "## Piattaforma: cosa succederà"
          case "$OPERATION" in
          mfa-reset)
          echo "- Operazione: mfa-reset (reset del secondo fattore)"
          echo "- Persona (app_user): ${USER_ID:0:8}"
          echo "- Admin che esegue (app_user): ${ACTOR_ID:0:8}"
          echo ""
          echo "La persona verrà disconnessa da tutti i locali in cui ha un accesso (e dalla console, se è l'account DigiAlto) e al prossimo accesso dovrà attivare di nuovo il codice."
          ;;
          set-mfa-enforcement)
          echo "- Operazione: set-mfa-enforcement"
          echo "- Locale: ${TENANT_ID:0:8}"
          echo "- Admin che esegue (app_user): ${ACTOR_ID:0:8}"
          case "$MODE" in
          off) echo "- Modalità: off" ;;
          enrolled) echo "- Modalità: enrolled" ;;
          required) echo "- Modalità: required" ;;
          esac
          ;;
          create-tenant)
          echo "- Operazione: create-tenant"
          echo "- I dati del locale e del titolare arrivano dai segreti dell'ambiente: non compaiono qui."
          echo "- Dopo l'esecuzione elimina i quattro segreti: TENANT_NAME, TENANT_VAT_NUMBER, OWNER_EMAIL, OWNER_NAME (Settings, Environments, platform-ops)."
          ;;
          bootstrap)
          echo "- Operazione: bootstrap (primo admin della piattaforma)"
          if [ "$AUTH_ID" = "" ]; then
          echo "- Account: cercato con il segreto dell'ambiente PLATFORM_ADMIN_EMAIL; l'indirizzo non compare mai."
          else
          echo "- Account (auth): ${AUTH_ID:0:8}"
          fi
          echo "- Dopo l'esecuzione: primo accesso alla console, poi attiva il codice nell'app."
          ;;
          esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OPERATION" = "mfa-reset" ] && [ "$CONFIRMED" != "true" ]; then
          echo "Conferma mancante: spunta conferma_disconnessione per eseguire il reset. / Confirmation missing."
          exit 1
          fi

  mfa-reset:
    name: Reset del secondo fattore
    needs: summary
    if: github.ref == 'refs/heads/main' && inputs.operation == 'mfa-reset' && inputs.conferma_disconnessione == true
    environment: platform-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the inputs
        run: |
          set -eu
          read_uuid() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          read_choice() { jq -er --arg k "$1" --arg allowed "$2" '(.inputs[$k] // "") as $v | $v | select(($allowed | split(" ")) | index($v))' "$GITHUB_EVENT_PATH"; }
          read_bool() { jq -er --arg k "$1" '(.inputs[$k] // "false") | tostring | select(. == "true" or . == "false")' "$GITHUB_EVENT_PATH"; }
          operation=$(read_choice operation "mfa-reset") || { echo "::error::operation: scelta non valida / invalid choice"; exit 1; }
          user=$(read_uuid user) || { echo "::error::user: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$user"
          echo "USER_ID=$user" >> "$GITHUB_ENV"
          actor=$(read_uuid actor) || { echo "::error::actor: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$actor"
          echo "ACTOR_ID=$actor" >> "$GITHUB_ENV"
          confirmed=$(read_bool conferma_disconnessione) || { echo "::error::conferma_disconnessione: valore non valido / invalid value"; exit 1; }
          if [ "$confirmed" != "true" ]; then
          echo "Conferma mancante: spunta conferma_disconnessione per eseguire il reset. / Confirmation missing."
          exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Reset
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/mfa-reset.ts --user "$USER_ID" --actor "$ACTOR_ID" --yes

  set-mfa-enforcement:
    name: Verifica in due passaggi del locale
    needs: summary
    if: github.ref == 'refs/heads/main' && inputs.operation == 'set-mfa-enforcement'
    environment: platform-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the inputs
        run: |
          set -eu
          read_uuid() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          read_choice() { jq -er --arg k "$1" --arg allowed "$2" '(.inputs[$k] // "") as $v | $v | select(($allowed | split(" ")) | index($v))' "$GITHUB_EVENT_PATH"; }
          read_bool() { jq -er --arg k "$1" '(.inputs[$k] // "false") | tostring | select(. == "true" or . == "false")' "$GITHUB_EVENT_PATH"; }
          operation=$(read_choice operation "set-mfa-enforcement") || { echo "::error::operation: scelta non valida / invalid choice"; exit 1; }
          tenant=$(read_uuid tenant) || { echo "::error::tenant: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$tenant"
          echo "TENANT_ID=$tenant" >> "$GITHUB_ENV"
          actor=$(read_uuid actor) || { echo "::error::actor: serve un uuid minuscolo / a lowercase uuid is required"; exit 1; }
          echo "::add-mask::$actor"
          echo "ACTOR_ID=$actor" >> "$GITHUB_ENV"
          mode=$(read_choice mode "off enrolled required") || { echo "::error::mode: valore non valido / invalid value"; exit 1; }
          echo "MODE=$mode" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Set the mode
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/set-mfa-enforcement.ts --tenant "$TENANT_ID" --mode "$MODE" --actor "$ACTOR_ID"

  create-tenant:
    name: Nuovo locale
    needs: summary
    if: github.ref == 'refs/heads/main' && inputs.operation == 'create-tenant'
    environment: platform-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the inputs
        run: |
          set -eu
          read_uuid() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          read_choice() { jq -er --arg k "$1" --arg allowed "$2" '(.inputs[$k] // "") as $v | $v | select(($allowed | split(" ")) | index($v))' "$GITHUB_EVENT_PATH"; }
          read_bool() { jq -er --arg k "$1" '(.inputs[$k] // "false") | tostring | select(. == "true" or . == "false")' "$GITHUB_EVENT_PATH"; }
          operation=$(read_choice operation "create-tenant") || { echo "::error::operation: scelta non valida / invalid choice"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Create the tenant and its owner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TENANT_NAME: ${{ secrets.TENANT_NAME }}
          TENANT_VAT_NUMBER: ${{ secrets.TENANT_VAT_NUMBER }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
        run: npx tsx scripts/create-tenant.ts

  bootstrap:
    name: Primo admin della piattaforma
    needs: summary
    if: github.ref == 'refs/heads/main' && inputs.operation == 'bootstrap'
    environment: platform-ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the inputs
        run: |
          set -eu
          read_uuid() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          read_choice() { jq -er --arg k "$1" --arg allowed "$2" '(.inputs[$k] // "") as $v | $v | select(($allowed | split(" ")) | index($v))' "$GITHUB_EVENT_PATH"; }
          read_bool() { jq -er --arg k "$1" '(.inputs[$k] // "false") | tostring | select(. == "true" or . == "false")' "$GITHUB_EVENT_PATH"; }
          read_uuid_opt() { jq -er --arg k "$1" '(.inputs[$k] // "") | select(. == "" or test("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z"))' "$GITHUB_EVENT_PATH"; }
          operation=$(read_choice operation "bootstrap") || { echo "::error::operation: scelta non valida / invalid choice"; exit 1; }
          auth_id=$(read_uuid_opt auth_id) || { echo "::error::auth_id: serve un uuid minuscolo o nulla / a lowercase uuid or nothing is required"; exit 1; }
          if [ "$auth_id" != "" ]; then
          echo "::add-mask::$auth_id"
          fi
          echo "AUTH_ID=$auth_id" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Make the platform admin account the platform admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
        run: npx tsx scripts/platform-admin.ts bootstrap ${AUTH_ID:+--auth-id "$AUTH_ID"}
