name: SP0 spike (local parts)

# SP0 (docs/plans/2026-11-14-sp00-spike.md): the local parts of the hook and role checks, on the local Supabase stack only. It touches no
# hosted project and uses no repository secret; every key below is generated by the stack on this runner and dies with it. Like the heavy
# jobs of ci.yml it runs on non-draft pull requests only, and only when the spike, a migration or the Auth config changes.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/spike/**"
      - "scripts/lib/sp00/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/sp0-spike.yml"

permissions:
  contents: read

concurrency:
  group: sp0-spike-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  sp0:
    name: SP0 spike, local parts (T1 to T5)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations + seed; Realtime stays on, T2 needs it)
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: psql for the scratch SQL
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Export the local stack's settings for the spike scripts
        run: |
          status=$(npx supabase status -o json)
          pick() { echo "$status" | jq -er "$1"; }
          SPIKE_SUPABASE_URL=$(pick '.API_URL')
          SPIKE_PUBLISHABLE_KEY=$(pick '.PUBLISHABLE_KEY // .ANON_KEY')
          SPIKE_SECRET_KEY=$(pick '.SECRET_KEY // .SERVICE_ROLE_KEY')
          E2E_MAILPIT_URL=$(pick '.MAILPIT_URL // .INBUCKET_URL')
          SPIKE_LOCAL_DB_URL=$(pick '.DB_URL')
          # The stack's generated keys and database URL are masked in the log before they are written to the job environment.
          echo "::add-mask::$SPIKE_PUBLISHABLE_KEY"
          echo "::add-mask::$SPIKE_SECRET_KEY"
          echo "::add-mask::$SPIKE_LOCAL_DB_URL"
          {
            echo "SPIKE_SUPABASE_URL=$SPIKE_SUPABASE_URL"
            echo "SPIKE_PUBLISHABLE_KEY=$SPIKE_PUBLISHABLE_KEY"
            echo "SPIKE_SECRET_KEY=$SPIKE_SECRET_KEY"
            echo "E2E_MAILPIT_URL=$E2E_MAILPIT_URL"
            echo "SPIKE_LOCAL_DB_URL=$SPIKE_LOCAL_DB_URL"
          } >> "$GITHUB_ENV"
      - name: Mark this stack as a throwaway target, then install the guard
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c "create schema sp0" -c "create table sp0.target_marker (project_ref text not null, production_ref text, created_at timestamptz not null default now())" -c "insert into sp0.target_marker (project_ref) values ('local')"
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/00_guard.sql
      - name: T5.L, no self sign-up and a script-created owner signs in
        run: npx tsx scripts/spike/sp00-auth.ts --target local --checks t5
      - name: Scratch 01 (probe hook) and self-check A
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/01_hook_probe.sql
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/90_selfcheck_a.sql
      - name: Scratch 02 (console role) and self-check B
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/02_console_role.sql
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/90_selfcheck_b.sql
      - name: Scratch 03 (memberships) and self-check C
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/03_memberships.sql
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/90_selfcheck_c.sql
      - name: T1.L, session_id on every sign-in method
        run: npx tsx scripts/spike/sp00-auth.ts --target local --checks t1
      - name: T2.L, the platform_staff role
        run: npx tsx scripts/spike/sp00-auth.ts --target local --checks t2
      - name: T3.L, switch tenant with one refresh
        run: npx tsx scripts/spike/sp00-auth.ts --target local --checks t3
      - name: Scratch 04 (T4 functions)
        run: psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/04_t4.sql
      - name: T4.L seed, the measured tenant
        run: |
          npx tsx scripts/spike/sp00-t4-seed.ts --target local | tee seed.json
          echo "SPIKE_T4_TENANT=$(tail -n 1 seed.json | jq -er '.tenantId')" >> "$GITHUB_ENV"
      - name: Self-check D
        run: psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/spike/sp00/sql/90_selfcheck_d.sql
      - name: T4.L, snapshot and timings with one tenant (smoke numbers, not results)
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select * from sp0.t4_snapshot('$SPIKE_T4_TENANT', '1 tenant')"
          for fn in mfa_gate dashboard_summary menu_list kitchen_tickets; do
            psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select * from sp0.t4_measure('$SPIKE_T4_TENANT', '$fn', 5)"
          done
      - name: T4.L, two more tenants, then snapshot and timings with three
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select * from sp0.t4_fill('$SPIKE_T4_TENANT', 2, 100000)"
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select * from sp0.t4_snapshot('$SPIKE_T4_TENANT', '3 tenants')"
          for fn in mfa_gate dashboard_summary menu_list kitchen_tickets; do
            psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select * from sp0.t4_measure('$SPIKE_T4_TENANT', '$fn', 5)"
          done
      - name: T4.L, the isolation check must pass
        run: |
          psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select * from sp0.t4_isolation('$SPIKE_T4_TENANT')"
          pass=$(psql "$SPIKE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At -c "select pass from sp0.t4_isolation('$SPIKE_T4_TENANT')")
          [ "$pass" = "t" ] || { echo "T4 isolation check failed"; exit 1; }
      - name: Supabase Auth and Realtime logs (on failure)
        if: failure()
        run: |
          docker logs --tail 200 supabase_auth_osteria-dei-rossi-app 2>&1 || docker ps -a
          docker logs --tail 200 supabase_realtime_osteria-dei-rossi-app 2>&1 || true
