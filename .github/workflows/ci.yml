name: CI

# CI budget (founder, 2026-10-24): a draft pull request runs only the `checks` job. The heavy jobs
# (pgTAP + Playwright, races, the T1 spike) run once the pull request is ready for review, on every
# later push to it, and on every push to main, so deploy-staging still follows a green main.
# Docs-only pull requests run nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same pull request. A running main run is never
# cancelled; a queued one may be replaced by a newer push to main (which also deploys its changes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Runner image (2026-11-09): every job is pinned to ubuntu-24.04. ubuntu-latest moved to 26.04, which Playwright 1.56.1
# does not support: install-deps failed with exit 0 and WebKit could not launch (run 42681111478). playwright-cache.yml warms
# the cache on the same image. Move the pin only with a Playwright version that supports the new image
# (tests/config/ci-runner-image.test.ts).
jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      # AT3: a high or critical advisory fails unless docs/go-live/audit-exceptions.json excepts it
      # with a reason and a review date (stale and expired exceptions fail too).
      - run: npx tsx scripts/audit-check.ts

  db-races:
    # Two-session cases pgTAP cannot run (scripts/test-db-races.sh). Plain Postgres is enough: the
    # script loads the same stand-ins as scripts/test-db-native.sh.
    name: Database (two-session races)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - run: scripts/test-db-races.sh

  supabase:
    # Two shards (founder Q180 option B, M25 plan): each is a job with its own 30-minute cap and its own stack and
    # build. Shard 1 also runs pgTAP and the integration suite, which need run only once. fail-fast stops the other
    # shard when one fails, so a red run costs no more than needed.
    name: Database (pgTAP) and E2E (Playwright) ${{ matrix.shard }}/2
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    env:
      # A fixed fake for the throwaway local stack only (staff PIN login derives passwords with it).
      # Production and Preview values live in Vercel and are never in the repo (ADR-010).
      PIN_PEPPER: test-pepper-not-a-secret-0123456789abcdef
      # Reservations (ADR-032, B12/B13): fakes for the throwaway stack only. The gate key is the same string as the fake Vault value in
      # supabase/seed.sql (the database checks the signature the routes make); mail goes to the stack's Mailpit; the cron secret lets the
      # tests run the mail route at once instead of waiting for pg_cron. Real values live in Vercel and Vault (docs/guides/cron-vault-secrets.md).
      RESERVATION_GATE_KEY: replace-me-local-reservation-gate-key-0000
      RESERVATION_LINK_KEY: replace-me-local-reservation-link-key-0000
      CRON_SECRET: test-cron-secret-not-a-secret-0123456789abcdef
      MAIL_TRANSPORT: mailpit
      MAIL_FROM: prenotazioni@example.com
      APP_PUBLIC_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations + seed)
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      - name: pgTAP (RLS, tenancy, hook, waiter columns)
        if: matrix.shard == 1
        run: npx supabase test db
      - name: Export local Supabase settings for the app and tests
        run: |
          status=$(npx supabase status -o json)
          pick() { echo "$status" | jq -er "$1"; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(pick '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(pick '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$(pick '.SECRET_KEY // .SERVICE_ROLE_KEY')"
            echo "E2E_MAILPIT_URL=$(pick '.MAILPIT_URL // .INBUCKET_URL')"
            echo "MAILPIT_URL=$(pick '.MAILPIT_URL // .INBUCKET_URL')"
          } >> "$GITHUB_ENV"
      - name: psql for the staff PIN integration tests, the e2e fixtures and the simulation's ledger check
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Real-stack integration tests (Auth, PostgREST, Storage)
        if: matrix.shard == 1
        run: npm run test:integration
      - run: npm run build
      # The browsers and the system packages apt downloads for them are cached, keyed on the exact Playwright version in
      # package-lock.json. A miss does the full install, keeps apt's .deb files and saves the cache at once (not only when
      # the whole job passes); a hit puts the .deb files back so install-deps reads them locally instead of from the mirror.
      # Each install fails fast on a hang: the apt mirror has served 114 MB at a few KB/s (runs 41898266512, 42083421981).
      - name: Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          test -n "$version" && test "$version" != undefined
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # v4 runs on Node 20 while the other actions are on v5 (Node 24); move to actions/cache@v5 once it is published.
      # Each ready pull request saves its own copy; if that evicts main's cache, save on main only.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Keep apt's downloaded packages
        run: |
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99-keep-downloaded-packages
      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium webkit
          mkdir -p ~/.cache/playwright-debs
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-debs {} +
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/playwright-debs
          echo "cached $(find ~/.cache/playwright-debs -maxdepth 1 -name '*.deb' | wc -l) .deb files"
      - name: Save Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: |
          sudo find ~/.cache/playwright-debs -maxdepth 1 -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          npx playwright install-deps chromium webkit
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      # The report artifact cannot always be fetched (M25, 2026-11-07): print each failed test's page snapshot (Playwright's
      # error-context.md, an accessibility tree of the fake CI data) into the log.
      - name: Page snapshots of the failed tests (on failure)
        if: failure()
        run: |
          find test-results -name error-context.md -print -exec cat {} \; 2>/dev/null || echo "no page snapshots"
      # A page closed under a test with no error from the test itself (CI 2026-11-04): show whether the runner ran out
      # of memory and the kernel killed a browser or the server.
      - name: Runner memory and OOM kills (on failure)
        if: failure()
        run: |
          free -m
          if sudo dmesg -T > /tmp/dmesg.txt; then
            grep -iE 'oom|killed process' /tmp/dmesg.txt || echo "no OOM kill in dmesg"
          else
            echo "dmesg unavailable"
          fi
      - name: Supabase Auth log (on failure)
        if: failure()
        run: docker logs --tail 200 supabase_auth_osteria-dei-rossi-app 2>&1 || docker ps -a
      # The page-closed failures (`browserContext.close: Test ended`, CI 2026-11-04 and after) cannot be diagnosed without the report
      # artifact. Print the tail of each failed test's trace (retain-on-failure). Per test: the last actions with their timing and,
      # for a failed one, the error's first line (200 characters, scrubbed of credentials, URL queries and e-mail addresses on a
      # best-effort list of patterns); and, for each console message and page error, only its kind, length and a hash. No params,
      # fill values, headers, cookies, bodies or console text are printed, and the .network file is never read. Diagnostics only:
      # a failure or a hang here cannot fail the job (continue-on-error, a 2 minute limit, a 60 second limit on each unzip).
      - name: Trace tail of the failed tests (on failure)
        if: failure()
        timeout-minutes: 2
        continue-on-error: true
        run: npx tsx scripts/ci/print-trace-tail.ts test-results || true
      # Runner limits a browser can hit: shared memory (Chromium keeps its renderer buffers there) and the process limits. `ulimit -a`
      # prints limits only, never the environment. Playwright 1.56.1 persists no worker exit reason: the only file it leaves is
      # test-results/.last-run.json (status and the ids of the failed tests); a worker crash is reported in the test output above.
      - name: Shared memory, process limits and last run (on failure)
        if: failure()
        timeout-minutes: 2
        continue-on-error: true
        run: |
          df -h /dev/shm || true
          ulimit -a || true
          cat test-results/.last-run.json 2>/dev/null || echo "no test-results/.last-run.json: no worker exit reason is recorded on disk, see the test output above"
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  t1-spike:
    # M11 step 0 (AT8). Its own job and stack on purpose: GoTrue allows 30 sign-ins per 5 minutes per
    # IP (config.toml sign_in_sign_ups) in a slowly refilling bucket, and the spike needs all 30. In
    # the supabase job, the integration and Playwright PIN logins would leave it a partial budget.
    name: T1 spike, staff PIN auth on the local stack (AT8)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations + seed)
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      - name: Export local Supabase settings for the spike
        run: |
          status=$(npx supabase status -o json)
          pick() { echo "$status" | jq -er "$1"; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(pick '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(pick '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$(pick '.SECRET_KEY // .SERVICE_ROLE_KEY')"
            echo "E2E_MAILPIT_URL=$(pick '.MAILPIT_URL // .INBUCKET_URL')"
          } >> "$GITHUB_ENV"
      - name: T1 spike
        # Local stack only (the script refuses any other URL). Prints one JSON line without secrets
        # and exits non-zero if any of checks a-e fails or the test user is not deleted. A 429 in (d)
        # or (e) is marked inconclusive; in (c) it is a real failure, since the budget starts full here.
        run: npx tsx scripts/spike/t1-staff-auth.ts
      - name: Supabase Auth log (on failure)
        if: failure()
        run: docker logs --tail 200 supabase_auth_osteria-dei-rossi-app 2>&1 || docker ps -a
