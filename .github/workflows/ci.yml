name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      # Runtime dependencies only: the dev-only lint toolchain carries an advisory with no fix
      # (braces via eslint-config-next), recorded in the M0 PR.
      - run: npm audit --omit=dev --audit-level=high

  db-races:
    # Two-session cases pgTAP cannot run (scripts/test-db-races.sh). Plain Postgres is enough: the
    # script loads the same stand-ins as scripts/test-db-native.sh.
    name: Database (two-session races)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - run: scripts/test-db-races.sh

  supabase:
    name: Database (pgTAP) and E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A fixed fake for the throwaway local stack only (staff PIN login derives passwords with it).
      # Production and Preview values live in Vercel and are never in the repo (ADR-010).
      PIN_PEPPER: test-pepper-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations + seed)
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      - name: pgTAP (RLS, tenancy, hook, waiter columns)
        run: npx supabase test db
      - name: Export local Supabase settings for the app and tests
        run: |
          status=$(npx supabase status -o json)
          pick() { echo "$status" | jq -er "$1"; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(pick '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(pick '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$(pick '.SECRET_KEY // .SERVICE_ROLE_KEY')"
            echo "E2E_MAILPIT_URL=$(pick '.MAILPIT_URL // .INBUCKET_URL')"
          } >> "$GITHUB_ENV"
      - name: psql for the staff PIN integration tests
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Real-stack integration tests (Auth, PostgREST, Storage)
        run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Supabase Auth log (on failure)
        if: failure()
        run: docker logs --tail 200 supabase_auth_osteria-dei-rossi-app 2>&1 || docker ps -a
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
