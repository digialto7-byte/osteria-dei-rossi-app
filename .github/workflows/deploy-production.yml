name: Deploy production database

# M25 step 15 (plan §3.1.6; founder Q190: manual migrations, then promote). Applies the repository's SQL migrations to the
# PRODUCTION Supabase project. It starts only by hand from the Actions tab, on main, and the 'production' environment's required
# reviewer (the founder) approves each run before any step has access to a secret. It never runs on a push or a schedule.
# It pushes migrations only (plain `supabase db push`, as staging does): never supabase/seed.sql, never a reset. Auth settings are
# set in the Supabase dashboard, not from here.
#
# Release order (runbook, "Releases"): merge, CI and staging are green; run this workflow and approve it; then promote the Vercel
# deployment; then run scripts/check-headers.ts against production. Migrations go first so the new code never meets an old schema.
#
# Environment 'production': secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF; variable
# PRODUCTION_PROJECT_REF. The job stops, with a named error, if the variable is empty, is the staging project, or differs from the
# secret. A missing secret fails the run (it does not skip): a production run that silently did nothing must not look like success.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # The only project this job may touch is the one named by the environment variable. Staging's ref is written out here so
      # that pasting it by mistake stops the job before anything is pushed.
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      STAGING_PROJECT_REF: wjowhjsfpcdykxwgjipq
    steps:
      - name: Check the production settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error title=No production project::Set the variable PRODUCTION_PROJECT_REF of the 'production' environment."
            exit 1
          fi
          if [ "$PRODUCTION_PROJECT_REF" = "$STAGING_PROJECT_REF" ]; then
            echo "::error title=Staging is not production::PRODUCTION_PROJECT_REF is the staging project; refusing to push."
            exit 1
          fi
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing production secrets::Add these secrets to the 'production' environment (missing: ${missing[*]})."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error title=Wrong project::SUPABASE_PROJECT_REF is not the project named by PRODUCTION_PROJECT_REF; refusing to push."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The secrets are not in this step's environment, so no dependency install script sees them.
      - run: npm ci

      - name: Link the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$PRODUCTION_PROJECT_REF"

      - name: Migrations that will be applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --dry-run

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --yes
