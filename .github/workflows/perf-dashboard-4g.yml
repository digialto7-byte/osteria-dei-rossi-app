name: Dashboard timing on Slow 4G (staging)

# M22 plan §5 step 18, AT7. Started by hand from the Actions tab on main only, once, after the M22 migrations have reached
# staging (they only get there from main); the 'staging' environment's required reviewer approves the run. It signs in the fake
# owner of the fake tenant "Osteria Demo Perf" (created by the order-entry timing run) on the staging project, loads Oggi 20 times
# cold and 20 times warm in Chromium through a simulated Slow 4G connection, and writes p50, p95 and max of the time until the
# "Ieri" tile is visible to the job summary. It is not a real phone, and the report says so. It reports numbers and promises none,
# and it never fails on a number. Each load of Oggi counts one open for that fake owner (the dashboard_open counter). The secrets
# live only in the 'staging' environment and reach the run step only: never npm ci, never the browser install, never the logs.
# The staging session cookie must reach nothing but the staging app: base_url must be exactly the host in the STAGING_APP_HOST
# variable of the 'staging' environment (no pattern, no suffix, no port), or the run stops before the script.
# The staging app host is behind Vercel Authentication: the script sends the "Protection Bypass for Automation" secret as
# x-vercel-protection-bypass to the app host (the secret VERCEL_AUTOMATION_BYPASS_SECRET of the 'staging' environment). If the
# secret is not set it sends nothing extra. The value is never printed.
# Nobody but the founder starts this workflow.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "The staging app address, https://..."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: perf-dashboard-4g
  cancel-in-progress: false

jobs:
  timing:
    name: Dashboard timing on Slow 4G against staging (AT7)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      # The only project this job may touch; any other Supabase URL stops it before the script runs.
      STAGING_PROJECT_REF: wjowhjsfpcdykxwgjipq
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Timing run against staging
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BASE_URL: ${{ inputs.base_url }}
          STAGING_APP_HOST: ${{ vars.STAGING_APP_HOST }}
          PERF_STAGING_OK: "yes"
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing staging secrets::Add SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY to the 'staging' environment (missing: ${missing[*]})."
            exit 1
          fi
          host="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          host="${host%%/*}"
          if [ "$host" != "$STAGING_PROJECT_REF.supabase.co" ]; then
            echo "::error title=Wrong project::SUPABASE_URL is not the staging project; refusing to run."
            exit 1
          fi
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "::error title=Wrong address::base_url must start with https://; refusing to run."
              exit 1
              ;;
          esac
          if [ -z "$STAGING_APP_HOST" ]; then
            echo "::error title=Staging host not configured::Set the STAGING_APP_HOST variable of the 'staging' environment to the staging app's host name (no https://)."
            exit 1
          fi
          app_host="${BASE_URL#https://}"
          app_host="${app_host%%/*}"
          if [ "$app_host" != "$STAGING_APP_HOST" ]; then
            echo "::error title=Wrong address::base_url is not the configured staging app host; refusing to run."
            exit 1
          fi
          npx tsx scripts/perf/dashboard-4g.ts --base-url "$BASE_URL" >> "$GITHUB_STEP_SUMMARY"
